<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VORTEX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-black: #000000;
      --bg-card: rgba(255, 255, 255, 0.04);
      --bg-card-subtle: rgba(255, 255, 255, 0.02);
      --border-white: rgba(255, 255, 255, 0.14);
      --border-hover: rgba(255, 255, 255, 0.4);
      --accent-white: #ffffff;
      --accent-gray: #a3a3a3;
      --accent-dark-gray: #262626;
      --accent-danger: #ffffff;
      --danger-border: rgba(255, 80, 80, 0.6);
      --text-main: #ffffff;
      --text-sub: #8e8e93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input, textarea {
      user-select: text;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, sans-serif;
      font-weight: 700;
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1, h2, h3, .heavy-font {
      font-family: 'Unbounded', sans-serif;
      font-weight: 900 !important;
      letter-spacing: -0.04em;
      text-transform: uppercase;
    }

    /* Монохромное жидкое стекло */
    .glass-panel {
      background: var(--bg-card);
      backdrop-filter: blur(40px) saturate(140%);
      -webkit-backdrop-filter: blur(40px) saturate(140%);
      border: 1px solid var(--border-white);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
    }

    .glass-panel-subtle {
      background: var(--bg-card-subtle);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
    }

    .btn-vortex {
      background: var(--accent-white);
      color: #000000;
      font-family: 'Unbounded', sans-serif;
      font-size: 11px;
      font-weight: 900;
      padding: 13px 20px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn-vortex:active { transform: scale(0.96); }

    .btn-ghost {
      background: transparent;
      color: #ffffff;
      border: 1px solid var(--border-white);
    }
    .btn-ghost:hover {
      border-color: var(--border-hover);
      background: rgba(255, 255, 255, 0.06);
    }

    .btn-danger {
      background: #1c0000;
      color: #ff5555;
      border: 1px solid var(--danger-border);
    }

    .input-vortex {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-white);
      border-radius: 14px;
      padding: 14px 16px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border 0.2s;
    }
    .input-vortex:focus {
      border-color: var(--accent-white);
    }

    /* Верхняя панель */
    .header-bar {
      max-width: 1000px;
      margin: 14px auto;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-layout {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 16px calc(90px + env(safe-area-inset-bottom, 0px));
      min-height: calc(100vh - 120px);
    }

    /* Мобильный бар на 3 вкладки */
    .bottom-navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(64px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-top: 1px solid var(--border-white);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 9999;
    }

    .nav-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      font-family: 'Unbounded', sans-serif;
      font-size: 9px;
      font-weight: 900;
    }
    .nav-tab-btn.active {
      color: var(--accent-white);
    }
    .nav-tab-btn.active svg {
      stroke: var(--accent-white);
    }

    .svg-icon {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: rgba(0, 0, 0, 0.96);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Переключатель Toggle Switch */
    .switch-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
    }
    .switch-ui {
      position: relative;
      width: 48px;
      height: 26px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .switch-ui::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background: #ffffff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .switch-ui.active {
      background: #ffffff;
    }
    .switch-ui.active::after {
      background: #000000;
      transform: translateX(22px);
    }

    /* Селектор номера */
    .phone-group {
      display: flex;
      gap: 8px;
    }
    .country-select {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-white);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      padding: 0 10px;
      border-radius: 14px;
      outline: none;
    }

    .chat-bubble {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .chat-bubble.out {
      align-self: flex-end;
      background: #ffffff;
      color: #000000;
    }
    .chat-bubble.in {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid var(--border-white);
    }
  </style>
</head>
<body>

  <!-- БАН ПАНЕЛЬ -->
  <div id="banOverlay" class="modal-backdrop" style="display: none;">
    <h2 class="heavy-font" style="font-size: 26px; margin-bottom: 12px;">СЕТЬ ЗАБЛОКИРОВАНА</h2>
    <p id="banReasonText" style="color: var(--text-sub); margin-bottom: 24px; text-align: center; font-size: 13px;"></p>
    <button class="btn-vortex" onclick="logoutSession()">ВЫХОД</button>
  </div>

  <!-- ВХОД / РЕГИСТРАЦИЯ ПО ТЕЛЕФОНУ -->
  <div id="authScreen" class="modal-backdrop" style="display: none;">
    <div class="glass-panel" style="width: 100%; max-width: 380px; padding: 32px 24px;">
      <h2 class="heavy-font" style="font-size: 24px; text-align: center; margin-bottom: 4px;">VORTEX</h2>
      <p style="text-align: center; color: var(--text-sub); font-size: 11px; margin-bottom: 24px; font-weight: 800;">SECURE ENCRYPTED NETWORK</p>

      <div style="display: flex; gap: 8px; margin-bottom: 18px;">
        <button id="authTab_login" class="btn-vortex" style="flex: 1;" onclick="toggleAuthMode('login')">ВХОД</button>
        <button id="authTab_reg" class="btn-vortex btn-ghost" style="flex: 1;" onclick="toggleAuthMode('register')">РЕГА</button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div class="phone-group">
          <select id="countryPrefix" class="country-select">
            <option value="+7">🇷🇺 +7</option>
            <option value="+375">🇧🇾 +375</option>
            <option value="+7_KZ">🇰🇿 +7</option>
            <option value="+998">🇺🇿 +998</option>
            <option value="+374">🇦🇲 +374</option>
            <option value="+995">🇬🇪 +995</option>
          </select>
          <input id="inputPhoneNumber" class="input-vortex" type="tel" placeholder="9990001122">
        </div>

        <input id="inputAuthUsername" class="input-vortex" type="text" placeholder="Никнейм (@username)" style="display: none;">
        <input id="inputAuthPassword" class="input-vortex" type="password" placeholder="Пароль">

        <p id="authErrorMsg" style="color: #ff5555; font-size: 12px; display: none; font-weight: 800;"></p>

        <button id="authSubmitAction" class="btn-vortex" style="width: 100%; margin-top: 8px;" onclick="handleAuthSubmit()">ВОЙТИ</button>
      </div>
    </div>
  </div>

  <!-- ШАПКА -->
  <header id="mainHeader" class="header-bar glass-panel" style="display: none;">
    <h1 class="heavy-font" style="font-size: 18px;">VORTEX</h1>
    <div id="adminBadgeNode" style="display: none;">
      <span style="font-size: 10px; background: #ffffff; color: #000000; padding: 4px 8px; border-radius: 6px; font-weight: 900;">ADMIN</span>
    </div>
  </header>

  <!-- ОСНОВНОЙ КОНТЕЙНЕР -->
  <div id="mainInterface" class="app-layout" style="display: none;">

    <!-- ВКЛАДКА 1: ЧАТЫ -->
    <section id="viewChats" style="height: calc(100vh - 160px); display: flex; flex-direction: column;">
      
      <!-- Список бесед -->
      <div id="chatsListContainer" class="glass-panel" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
        <div style="padding: 14px; border-bottom: 1px solid var(--border-white);">
          <input id="dialogFilter" class="input-vortex" placeholder="Поиск диалогов..." oninput="filterDialogs()">
        </div>
        <div id="activeDialogsBox" style="flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px;"></div>
      </div>

      <!-- Окно переписки -->
      <div id="chatRoomContainer" class="glass-panel" style="display: none; height: 100%; flex-direction: column; overflow: hidden;">
        
        <!-- Заголовок чата -->
        <div style="padding: 14px 18px; border-bottom: 1px solid var(--border-white); display: flex; justify-content: space-between; align-items: center;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <button class="btn-vortex btn-ghost" style="padding: 6px 12px; font-size: 10px;" onclick="closeChatRoom()">← НАЗАД</button>
            <div>
              <h3 id="currentChatPeerName" class="heavy-font" style="font-size: 14px;">ПОЛЬЗОВАТЕЛЬ</h3>
              <span id="currentChatPeerPhone" style="font-size: 11px; color: var(--text-sub);"></span>
            </div>
          </div>
          <span style="font-size: 10px; border: 1px solid var(--border-white); padding: 4px 8px; border-radius: 20px;">E2EE AES-256</span>
        </div>

        <!-- Сообщения -->
        <div id="chatMessagesScroll" style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;"></div>

        <!-- Панель отправки -->
        <div style="padding: 12px 16px; border-top: 1px solid var(--border-white); display: flex; gap: 8px; align-items: center;">
          <input type="file" id="mediaUploadField" style="display: none;" onchange="handleOutgoingAttachment(event)">
          <button class="btn-vortex btn-ghost" style="padding: 10px;" onclick="document.getElementById('mediaUploadField').click()">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
          </button>

          <input id="outgoingMessageInput" class="input-vortex" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter') sendEncryptedPayload()">
          
          <button class="btn-vortex" onclick="sendEncryptedPayload()">
            <svg class="svg-icon" style="width: 18px; height: 18px;" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- ВКЛАДКА 2: КОНТАКТЫ И ПОИСК -->
    <section id="viewContacts" style="display: none;">
      <div class="glass-panel" style="padding: 22px;">
        <h2 class="heavy-font" style="font-size: 18px; margin-bottom: 6px;">ПОИСК ЛЮДЕЙ</h2>
        <p style="font-size: 12px; color: var(--text-sub); margin-bottom: 16px;">Поиск работает по никнейму (@username) или по номеру телефона</p>

        <div style="display: flex; gap: 8px; margin-bottom: 20px;">
          <input id="globalSearchQuery" class="input-vortex" placeholder="Введите @username или номер (+7999...)" onkeydown="if(event.key==='Enter') executeUserSearch()">
          <button class="btn-vortex" onclick="executeUserSearch()">НАЙТИ</button>
        </div>

        <div id="searchResultsArea" style="display: flex; flex-direction: column; gap: 10px;"></div>
      </div>
    </section>

    <!-- ВКЛАДКА 3: НАСТРОЙКИ И ПРОФИЛЬ -->
    <section id="viewProfile" style="display: none;">
      <div class="glass-panel" style="padding: 24px; display: flex; flex-direction: column; gap: 20px;">
        
        <div>
          <h2 id="profileUsernameVal" class="heavy-font" style="font-size: 20px;">@USER</h2>
          <p id="profilePhoneVal" style="color: var(--text-sub); font-size: 13px; margin-top: 4px;"></p>
        </div>

        <div class="glass-panel-subtle" style="padding: 18px;">
          <h3 class="heavy-font" style="font-size: 13px; margin-bottom: 10px;">ПРИВАТНОСТЬ И БЕЗОПАСНОСТЬ</h3>
          
          <div class="switch-wrap">
            <div>
              <span style="font-size: 13px; display: block;">Скрыть номер телефона</span>
              <span style="font-size: 11px; color: var(--text-sub);">Номер пропадет из профиля, и вас нельзя будет найти по нему</span>
            </div>
            <div id="hidePhoneSwitch" class="switch-ui" onclick="toggleHidePhoneSetting()"></div>
          </div>
        </div>

        <button class="btn-vortex btn-ghost btn-danger" style="margin-top: 10px;" onclick="logoutSession()">ВЫЙТИ ИЗ АККАУНТА</button>
      </div>
    </section>
  </div>

  <!-- НАВБАР МЕНЮ -->
  <nav id="bottomBar" class="bottom-navbar" style="display: none;">
    <button id="tabBtn_chats" class="nav-tab-btn active" onclick="switchMainTab('chats')">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      <span>ЧАТЫ</span>
    </button>
    <button id="tabBtn_contacts" class="nav-tab-btn" onclick="switchMainTab('contacts')">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      <span>КОНТАКТЫ</span>
    </button>
    <button id="tabBtn_profile" class="nav-tab-btn" onclick="switchMainTab('profile')">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span>ПРОФИЛЬ</span>
    </button>
  </nav>

  <script>
    /* ========================================================================
       КОНФИГУРАЦИЯ SUPABASE И КРИПТОГРАФИЯ
       ======================================================================== */
    const SUPABASE_URL = "https://mmraltxnupyoizitrutm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_29yMrLgng8O54O10nNBHBA_U1Sqyuv_";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let activeUser = null;
    let openedChatContext = null;
    let localECDHKey = null;
    let sharedSecretKey = null;

    /* Генерация криптографических ключей */
    async function initClientCrypto() {
      localECDHKey = await window.crypto.subtle.generateKey(
        { name: "ECDH", namedCurve: "P-384" },
        true,
        ["deriveKey"]
      );
      const rawPublic = await window.crypto.subtle.exportKey("raw", localECDHKey.publicKey);
      return btoa(String.fromCharCode(...new Uint8Array(rawPublic)));
    }

    async function computeSharedKey(peerPublicKeyString) {
      if (!peerPublicKeyString) return;
      const rawKey = Uint8Array.from(atob(peerPublicKeyString), c => c.charCodeAt(0));
      const peerImported = await window.crypto.subtle.importKey(
        "raw",
        rawKey,
        { name: "ECDH", namedCurve: "P-384" },
        false,
        []
      );

      sharedSecretKey = await window.crypto.subtle.deriveKey(
        { name: "ECDH", public: peerImported },
        localECDHKey.privateKey,
        { name: "AES-GCM", length: 256 },
        true,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptPayload(text) {
      const iv = window.crypto.getRandomValues(new Uint8Array(12));
      const data = new TextEncoder().encode(text);
      const cipher = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        sharedSecretKey,
        data
      );
      return {
        ciphertext: btoa(String.fromCharCode(...new Uint8Array(cipher))),
        iv: btoa(String.fromCharCode(...iv))
      };
    }

    async function decryptPayload(ciphertextB64, ivB64) {
      try {
        const iv = Uint8Array.from(atob(ivB64), c => c.charCodeAt(0));
        const cipher = Uint8Array.from(atob(ciphertextB64), c => c.charCodeAt(0));
        const clear = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv: iv },
          sharedSecretKey,
          cipher
        );
        return new TextDecoder().decode(clear);
      } catch (e) {
        return "🔒 [Зашифрованное вложение]";
      }
    }

    /* ========================================================================
       АВТОРИЗАЦИЯ ПО ТЕЛЕФОНУ + ПАРОЛЬ
       ======================================================================== */
    let authMode = 'login';
    function toggleAuthMode(mode) {
      authMode = mode;
      document.getElementById('inputAuthUsername').style.display = mode === 'register' ? 'block' : 'none';
      document.getElementById('authSubmitAction').innerText = mode === 'register' ? 'СОЗДАТЬ' : 'ВОЙТИ';
      document.getElementById('authTab_login').className = mode === 'login' ? 'btn-vortex' : 'btn-vortex btn-ghost';
      document.getElementById('authTab_reg').className = mode === 'register' ? 'btn-vortex' : 'btn-vortex btn-ghost';
    }

    function formatFullPhone() {
      let prefix = document.getElementById('countryPrefix').value;
      if (prefix === '+7_KZ') prefix = '+7';
      const cleanNumber = document.getElementById('inputPhoneNumber').value.replace(/\D/g, '');
      return prefix + cleanNumber;
    }

    async function hashUserPassword(pass) {
      const encoded = new TextEncoder().encode(pass + "_vortex_salt_2026");
      const digest = await window.crypto.subtle.digest("SHA-256", encoded);
      return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function handleAuthSubmit() {
      const fullPhone = formatFullPhone();
      const password = document.getElementById('inputAuthPassword').value;
      const username = document.getElementById('inputAuthUsername').value.trim().toLowerCase();
      const errBox = document.getElementById('authErrorMsg');
      errBox.style.display = 'none';

      if (!password || document.getElementById('inputPhoneNumber').value.length < 5) {
        errBox.innerText = "Укажите корректный номер и пароль";
        errBox.style.display = 'block';
        return;
      }

      const passHash = await hashUserPassword(password);

      if (authMode === 'register') {
        if (!username) {
          errBox.innerText = "Придумайте никнейм";
          errBox.style.display = 'block';
          return;
        }

        const pubKey = await initClientCrypto();

        const { data: userCreated, error } = await supabase.from('profiles').insert([{
          phone: fullPhone,
          username: username,
          password_hash: passHash,
          public_key: pubKey,
          hide_phone: false
        }]).select().single();

        if (error) {
          errBox.innerText = error.message.includes('unique') ? "Номер или никнейм уже занят" : error.message;
          errBox.style.display = 'block';
          return;
        }

        completeSession(userCreated);
      } else {
        const { data: userProfile, error } = await supabase
          .from('profiles')
          .select('*')
          .eq('phone', fullPhone)
          .eq('password_hash', passHash)
          .single();

        if (!userProfile || error) {
          errBox.innerText = "Неверный номер телефона или пароль";
          errBox.style.display = 'block';
          return;
        }

        if (userProfile.is_banned) {
          showBanScreen(userProfile.ban_reason);
          return;
        }

        const pubKey = await initClientCrypto();
        await supabase.from('profiles').update({ public_key: pubKey }).eq('id', userProfile.id);
        userProfile.public_key = pubKey;

        completeSession(userProfile);
      }
    }

    function completeSession(userRecord) {
      activeUser = userRecord;
      localStorage.setItem('vortex_session_token', JSON.stringify(userRecord));
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('mainHeader').style.display = 'flex';
      document.getElementById('mainInterface').style.display = 'block';
      document.getElementById('bottomBar').style.display = 'flex';

      if (userRecord.role === 'admin' || userRecord.username === 'vortex') {
        document.getElementById('adminBadgeNode').style.display = 'block';
      }

      renderProfileInfo();
      loadActiveDialogs();
      listenRealtimeMessages();
    }

    function logoutSession() {
      localStorage.removeItem('vortex_session_token');
      location.reload();
    }

    function showBanScreen(reason) {
      document.getElementById('banReasonText').innerText = reason || "Нарушение регламента платформы";
      document.getElementById('banOverlay').style.display = 'flex';
    }

    /* ========================================================================
       ПОИСК И КОНТАКТЫ
       ======================================================================== */
    async function executeUserSearch() {
      const rawQuery = document.getElementById('globalSearchQuery').value.trim();
      const resultsContainer = document.getElementById('searchResultsArea');
      resultsContainer.innerHTML = '';

      if (!rawQuery) return;

      const cleanQuery = rawQuery.toLowerCase().replace('@', '');

      // Ищем по никнейму или по номеру телефона (если не скрыт)
      const { data: foundUsers } = await supabase
        .from('profiles')
        .select('*')
        .or(`username.ilike.%${cleanQuery}%,and(phone.eq.${rawQuery},hide_phone.eq.false)`)
        .limit(20);

      if (!foundUsers || foundUsers.length === 0) {
        resultsContainer.innerHTML = '<p style="color: var(--text-sub); font-size: 13px;">Ничего не найдено</p>';
        return;
      }

      foundUsers.forEach(u => {
        if (u.id === activeUser.id) return;
        const row = document.createElement('div');
        row.className = 'glass-panel-subtle';
        row.style.padding = '12px 16px';
        row.style.display = 'flex';
        row.style.justifyContent = 'space-between';
        row.style.alignItems = 'center';

        const displayPhone = u.hide_phone ? 'Номер скрыт' : u.phone;

        row.innerHTML = `
          <div>
            <strong style="font-size: 14px;">@${u.username}</strong>
            <span style="font-size: 11px; color: var(--text-sub); display: block;">${displayPhone}</span>
          </div>
          <button class="btn-vortex" style="padding: 8px 14px; font-size: 10px;" onclick="openChatWithUser('${u.id}', '${u.username}', '${displayPhone}', '${u.public_key || ''}')">НАПИСАТЬ</button>
        `;
        resultsContainer.appendChild(row);
      });
    }

    /* ========================================================================
       МЕССЕНДЖЕР И ЧАТЫ
       ======================================================================== */
    async function loadActiveDialogs() {
      const { data: userChats } = await supabase
        .from('chats')
        .select('*')
        .or(`user1_id.eq.${activeUser.id},user2_id.eq.${activeUser.id}`);

      const box = document.getElementById('activeDialogsBox');
      box.innerHTML = '';
      if (!userChats || userChats.length === 0) {
        box.innerHTML = '<p style="color: var(--text-sub); font-size: 12px; text-align: center; margin-top: 20px;">Нет активных диалогов. Найдите собеседника в контактах.</p>';
        return;
      }

      for (const chat of userChats) {
        const peerId = chat.user1_id === activeUser.id ? chat.user2_id : chat.user1_id;
        const { data: peerProfile } = await supabase.from('profiles').select('*').eq('id', peerId).single();
        if (!peerProfile) continue;

        const row = document.createElement('div');
        row.className = 'glass-panel-subtle';
        row.style.padding = '14px';
        row.style.cursor = 'pointer';

        const displayPhone = peerProfile.hide_phone ? 'Номер скрыт' : peerProfile.phone;

        row.onclick = () => openChatWithUser(peerProfile.id, peerProfile.username, displayPhone, peerProfile.public_key);
        row.innerHTML = `
          <div style="display: flex; justify-content: space-between;">
            <strong style="font-size: 14px;">@${peerProfile.username}</strong>
            <span style="font-size: 11px; color: var(--text-sub);">${displayPhone}</span>
          </div>
        `;
        box.appendChild(row);
      }
    }

    async function openChatWithUser(peerId, peerName, peerPhone, peerPubKey) {
      // Ищем или создаем диалог
      let { data: existingChat } = await supabase.from('chats')
        .select('*')
        .or(`and(user1_id.eq.${activeUser.id},user2_id.eq.${peerId}),and(user1_id.eq.${peerId},user2_id.eq.${activeUser.id})`)
        .single();

      if (!existingChat) {
        const { data: newChat } = await supabase.from('chats').insert([{
          user1_id: activeUser.id,
          user2_id: peerId
        }]).select().single();
        existingChat = newChat;
      }

      openedChatContext = { chat: existingChat, peerId, peerName, peerPhone };

      document.getElementById('chatsListContainer').style.display = 'none';
      document.getElementById('chatRoomContainer').style.display = 'flex';
      document.getElementById('currentChatPeerName').innerText = `@${peerName}`;
      document.getElementById('currentChatPeerPhone').innerText = peerPhone;

      await computeSharedKey(peerPubKey);
      loadRoomMessages(existingChat.id);
      switchMainTab('chats');
    }

    function closeChatRoom() {
      document.getElementById('chatRoomContainer').style.display = 'none';
      document.getElementById('chatsListContainer').style.display = 'flex';
      openedChatContext = null;
      loadActiveDialogs();
    }

    async function sendEncryptedPayload(attachedMedia = null) {
      const input = document.getElementById('outgoingMessageInput');
      const text = input.value.trim();

      if (!text && !attachedMedia) return;

      let payloadCipher = { ciphertext: '', iv: '' };
      if (text && sharedSecretKey) {
        payloadCipher = await encryptPayload(text);
      }

      await supabase.from('messages').insert([{
        chat_id: openedChatContext.chat.id,
        sender_id: activeUser.id,
        ciphertext: payloadCipher.ciphertext,
        iv: payloadCipher.iv,
        media_url: attachedMedia ? attachedMedia.url : '',
        media_type: attachedMedia ? attachedMedia.type : 'text',
        file_name: attachedMedia ? attachedMedia.name : ''
      }]);

      input.value = '';
    }

    async function handleOutgoingAttachment(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64 = e.target.result;
        let type = 'file';
        if (file.type.startsWith('image/')) type = 'image';
        if (file.type.startsWith('video/')) type = 'video';

        await sendEncryptedPayload({ url: base64, type: type, name: file.name });
      };
      reader.readAsDataURL(file);
    }

    async function loadRoomMessages(chatId) {
      const { data: msgs } = await supabase
        .from('messages')
        .select('*')
        .eq('chat_id', chatId)
        .order('created_at', { ascending: true });

      const container = document.getElementById('chatMessagesScroll');
      container.innerHTML = '';
      if (!msgs) return;

      for (const m of msgs) {
        const isSelf = m.sender_id === activeUser.id;
        const bubble = document.createElement('div');
        bubble.className = `chat-bubble ${isSelf ? 'out' : 'in'}`;

        let content = '';
        if (m.ciphertext && sharedSecretKey) {
          content += `<div>${await decryptPayload(m.ciphertext, m.iv)}</div>`;
        }

        if (m.media_url) {
          if (m.media_type === 'image') {
            content += `<img src="${m.media_url}" style="width: 100%; max-width: 260px; border-radius: 10px; margin-top: 4px;">`;
          } else if (m.media_type === 'video') {
            content += `<video src="${m.media_url}" controls style="width: 100%; max-width: 260px; border-radius: 10px; margin-top: 4px;"></video>`;
          } else {
            content += `<a href="${m.media_url}" download="${m.file_name}" style="color: inherit; text-decoration: underline; font-size: 12px; margin-top: 4px; display: block;">📄 ${m.file_name || 'Файл'}</a>`;
          }
        }

        bubble.innerHTML = content + `<span style="font-size: 8px; opacity: 0.6; align-self: flex-end; margin-top: 2px;">${new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>`;
        container.appendChild(bubble);
      }
      container.scrollTop = container.scrollHeight;
    }

    function listenRealtimeMessages() {
      supabase.channel('messages_realtime_room')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          if (openedChatContext && payload.new.chat_id === openedChatContext.chat.id) {
            loadRoomMessages(openedChatContext.chat.id);
          }
        })
        .subscribe();
    }

    /* ========================================================================
       ПРИВАТНОСТЬ И НАСТРОЙКИ
       ======================================================================== */
    function renderProfileInfo() {
      document.getElementById('profileUsernameVal').innerText = `@${activeUser.username}`;
      document.getElementById('profilePhoneVal').innerText = activeUser.phone;
      
      const toggle = document.getElementById('hidePhoneSwitch');
      if (activeUser.hide_phone) {
        toggle.classList.add('active');
      } else {
        toggle.classList.remove('active');
      }
    }

    async function toggleHidePhoneSetting() {
      const toggle = document.getElementById('hidePhoneSwitch');
      const newState = !activeUser.hide_phone;

      await supabase.from('profiles').update({ hide_phone: newState }).eq('id', activeUser.id);
      activeUser.hide_phone = newState;

      if (newState) {
        toggle.classList.add('active');
      } else {
        toggle.classList.remove('active');
      }
    }

    /* ========================================================================
       МАРШРУТИЗАЦИЯ
       ======================================================================== */
    function switchMainTab(tab) {
      ['chats', 'contacts', 'profile'].forEach(t => {
        document.getElementById(`view${t.charAt(0).toUpperCase() + t.slice(1)}`).style.display = 'none';
        document.getElementById(`tabBtn_${t}`).classList.remove('active');
      });

      document.getElementById(`view${tab.charAt(0).toUpperCase() + tab.slice(1)}`).style.display = 'block';
      document.getElementById(`tabBtn_${tab}`).classList.add('active');
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const saved = localStorage.getItem('vortex_session_token');
      if (saved) {
        const parsed = JSON.parse(saved);
        const { data: dbAccount } = await supabase.from('profiles').select('*').eq('id', parsed.id).single();
        if (dbAccount && dbAccount.is_banned) {
          showBanScreen(dbAccount.ban_reason);
          return;
        }
        await initClientCrypto();
        completeSession(dbAccount || parsed);
      } else {
        document.getElementById('authScreen').style.display = 'flex';
      }
    });
  </script>
</body>
</html>
